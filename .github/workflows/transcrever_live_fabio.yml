name: Transcrever canais de mercado

on:
  workflow_dispatch:
  schedule:
    # Segunda a sexta, 09:00 em São Paulo = 12:00 UTC
    - cron: "0 12 * * 1-5"
    # Domingo, 09:00 em São Paulo = 12:00 UTC
    - cron: "0 12 * * 0"

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rodar transcrições
        shell: bash
        run: |
          set -uo pipefail

          # Cada site de transcrição recebe até 150 segundos após o comando
          # de gerar a transcrição. O Python consulta a página a cada 5 segundos
          # e só considera falha depois desse período.
          export TRANSCRIPT_WAIT_SECONDS=150
          export POLL_INTERVAL_SECONDS=5
          export MAX_PROVIDER_CYCLES=2
          export WAIT_BETWEEN_CYCLES=20

          FAILURES=0

          run_channel() {
            local channel_name="$1"
            local channel_url="$2"
            local content_kind="$3"
            local output_file="$4"
            local force_retranscribe="$5"

            echo ""
            echo "============================================================"
            echo "Iniciando: ${channel_name}"
            echo "Saída: ${output_file}"
            echo "============================================================"

            if \
              CHANNEL_NAME="${channel_name}" \
              CHANNEL_URL="${channel_url}" \
              CONTENT_KIND="${content_kind}" \
              OUTPUT_FILE="${output_file}" \
              FORCE_RETRANSCRIBE="${force_retranscribe}" \
              python transcrever_live_fabio.py
            then
              echo "OK: ${channel_name}"
            else
              echo "::warning::Falha na transcrição de ${channel_name}. O workflow continuará para os outros canais."
              FAILURES=$((FAILURES + 1))
            fi
          }

          echo "Evento: '${{ github.event_name }}'"
          echo "Schedule: '${{ github.event.schedule }}'"

          # Run workflow manual = teste completo dos 3 canais.
          # Domingo agendado = rotina completa dos 3 canais.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then

            echo "Modo completo: Fábio + BTG + Clube dos Dividendos."

            run_channel \
              "Fabio Adriano" \
              "https://www.youtube.com/@fabioadriano/streams" \
              "live" \
              "ultima_live.txt" \
              "1"

            run_channel \
              "BTG Trader" \
              "https://www.youtube.com/@BTGTrader/streams" \
              "live" \
              "ultima_live_btg.txt" \
              "1"

            run_channel \
              "Clube dos Dividendos" \
              "https://www.youtube.com/@ClubedosDividendos/videos" \
              "video" \
              "ultimo_video_clube_dos_dividendos.txt" \
              "1"

          else
            # Segunda a sexta: continua a rotina diária só do Fábio.
            echo "Modo dias úteis: apenas Fábio Adriano."

            run_channel \
              "Fabio Adriano" \
              "https://www.youtube.com/@fabioadriano/streams" \
              "live" \
              "ultima_live.txt" \
              "0"
          fi

          echo ""
          echo "Total de canais que falharam: ${FAILURES}"
          echo "Mesmo com uma falha, os arquivos obtidos com sucesso serão commitados."

      - name: Commit das transcrições obtidas
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f ultima_live.txt ] && git add ultima_live.txt
          [ -f ultima_live_btg.txt ] && git add ultima_live_btg.txt
          [ -f ultimo_video_clube_dos_dividendos.txt ] && git add ultimo_video_clube_dos_dividendos.txt

          if git diff --cached --quiet; then
            echo "Nenhuma transcrição nova para commit."
          else
            git commit -m "Atualiza transcrições dos canais monitorados"
            git push
          fi
