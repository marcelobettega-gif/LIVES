name: Transcrever canais de mercado

on:
  workflow_dispatch:
  schedule:
    # Segunda a sexta, 09:00 em São Paulo = 12:00 UTC
    - cron: "0 12 * * 1-5"
    # Domingo, 09:00 em São Paulo = 12:00 UTC
    - cron: "0 12 * * 0"

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rodar transcrições
        shell: bash
        run: |
          set -euo pipefail

          echo "Schedule recebido: '${{ github.event.schedule }}'"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then
            echo "Execução manual ou dominical: transcrever os 3 canais."

            FORCE_RETRANSCRIBE=1 \
            CHANNEL_NAME="Fabio Adriano" \
            CHANNEL_URL="https://www.youtube.com/@fabioadriano/streams" \
            CONTENT_KIND="live" \
            OUTPUT_FILE="ultima_live.txt" \
            python transcrever_live_fabio.py

            FORCE_RETRANSCRIBE=1 \
            CHANNEL_NAME="BTG Trader" \
            CHANNEL_URL="https://www.youtube.com/@BTGTrader/streams" \
            CONTENT_KIND="live" \
            OUTPUT_FILE="ultima_live_btg.txt" \
            python transcrever_live_fabio.py

            FORCE_RETRANSCRIBE=1 \
            CHANNEL_NAME="Clube dos Dividendos" \
            CHANNEL_URL="https://www.youtube.com/@ClubedosDividendos/videos" \
            CONTENT_KIND="video" \
            OUTPUT_FILE="ultimo_video_clube_dos_dividendos.txt" \
            python transcrever_live_fabio.py
          else
            echo "Execução de segunda a sexta: transcrever apenas a última live do Fabio Adriano."

            CHANNEL_NAME="Fabio Adriano" \
            CHANNEL_URL="https://www.youtube.com/@fabioadriano/streams" \
            CONTENT_KIND="live" \
            OUTPUT_FILE="ultima_live.txt" \
            python transcrever_live_fabio.py
          fi

      - name: Commit das transcrições
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f ultima_live.txt ] && git add ultima_live.txt
          [ -f ultima_live_btg.txt ] && git add ultima_live_btg.txt
          [ -f ultimo_video_clube_dos_dividendos.txt ] && git add ultimo_video_clube_dos_dividendos.txt

          git diff --cached --quiet || git commit -m "Atualiza transcrições dos canais monitorados"
          git push
