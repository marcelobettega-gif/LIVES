import re
import time
from pathlib import Path
from urllib.request import Request, urlopen
from urllib.error import URLError, HTTPError

from playwright.sync_api import sync_playwright


CHANNEL_URL = "https://www.youtube.com/@fabioadriano/streams"
OUTPUT_FILE = Path("ultima_live.txt")

MAX_2OUTUBE_ATTEMPTS = 4
WAIT_BETWEEN_ATTEMPTS = 90

MIN_TRANSCRIPT_LENGTH = 2000


def extract_video_id(url: str):
    patterns = [
        r"/live/([A-Za-z0-9_-]{11})",
        r"[?&]v=([A-Za-z0-9_-]{11})",
        r"youtu\.be/([A-Za-z0-9_-]{11})",
    ]

    for pattern in patterns:
        match = re.search(pattern, url or "")
        if match:
            return match.group(1)

    return None


def find_latest_live(page):
    print("Abrindo canal do Fabio Adriano...")

    page.goto(
        CHANNEL_URL,
        wait_until="domcontentloaded",
        timeout=90000
    )

    page.wait_for_timeout(7000)

    print("Procurando o primeiro vídeo da aba Ao vivo...")

    links = page.locator(
        'a[href*="/live/"], a[href*="/watch?v="]'
    )

    found_ids = []

    for i in range(links.count()):
        try:
            href = links.nth(i).get_attribute("href")

            if not href:
                continue

            video_id = extract_video_id(href)

            if not video_id:
                continue

            if video_id in found_ids:
                continue

            found_ids.append(video_id)

            youtube_url = (
                f"https://www.youtube.com/live/{video_id}"
            )

            print("Primeiro vídeo encontrado:")
            print(youtube_url)

            return video_id, youtube_url

        except Exception:
            continue

    raise RuntimeError(
        "Não foi possível localizar nenhum vídeo na aba Ao vivo."
    )


def clean_transcript(text):
    if not text:
        return None

    text = text.strip()

    if len(text) < MIN_TRANSCRIPT_LENGTH:
        return None

    lower = text.lower()

    bad_messages = [
        "transcript not available",
        "no transcript available",
        "transcript unavailable",
        "unable to generate transcript",
        "could not generate transcript",
        "video unavailable",
    ]

    for bad in bad_messages:
        if bad in lower and len(text) < 5000:
            return None

    return text


def extract_transcript_from_page(page):
    candidates = []

    selectors = [
        "textarea",
        "pre",
        '[class*="transcript"]',
        '[id*="transcript"]',
        '[class*="caption"]',
        '[id*="caption"]',
        "article",
        "main",
    ]

    for selector in selectors:
        try:
            locator = page.locator(selector)

            for i in range(locator.count()):
                try:
                    element = locator.nth(i)

                    try:
                        text = element.input_value()
                    except Exception:
                        text = element.inner_text()

                    text = clean_transcript(text)

                    if text:
                        candidates.append(text)

                except Exception:
                    continue

        except Exception:
            continue

    try:
        body = page.locator("body").inner_text()
        body = clean_transcript(body)

        if body:
            candidates.append(body)

    except Exception:
        pass

    if not candidates:
        return None

    transcript = max(
        candidates,
        key=len
    )

    return transcript


def try_2outube_direct(page, video_id):
    urls = [
        f"https://2outube.com/watch?v={video_id}",
        f"https://2outube.com/live/{video_id}",
    ]

    for url in urls:
        try:
            print(f"Tentando 2outube diretamente: {url}")

            page.goto(
                url,
                wait_until="domcontentloaded",
                timeout=90000
            )

            page.wait_for_timeout(8000)

            transcript = extract_transcript_from_page(page)

            if transcript:
                print(
                    f"Transcrição encontrada diretamente no 2outube "
                    f"({len(transcript)} caracteres)."
                )
                return transcript

        except Exception as exc:
            print(f"Falha no acesso direto ao 2outube: {exc}")

    return None


def try_2outube_form(page, youtube_url):
    print("Abrindo página inicial do 2outube...")

    page.goto(
        "https://2outube.com/",
        wait_until="domcontentloaded",
        timeout=90000
    )

    page.wait_for_timeout(4000)

    selectors = [
        'input[type="url"]',
        'input[name*="url"]',
        'input[id*="url"]',
        'input[placeholder*="YouTube"]',
        'input[placeholder*="youtube"]',
        'input[placeholder*="Paste"]',
        'input[placeholder*="paste"]',
        "input",
    ]

    input_box = None

    for selector in selectors:
        try:
            locator = page.locator(selector)

            if locator.count() > 0:
                candidate = locator.first

                if candidate.is_visible():
                    input_box = candidate
                    break

        except Exception:
            continue

    if input_box is None:
        print("Campo de URL não encontrado no 2outube.")
        return None

    print("Colando URL completa...")
    input_box.fill(youtube_url)

    page.wait_for_timeout(1000)

    buttons = [
        "Get Transcript",
        "Get Free Transcript",
        "Transcript",
        "Transcribe",
        "Generate",
        "Submit",
    ]

    button = None

    for text in buttons:
        try:
            locator = page.get_by_text(
                text,
                exact=False
            )

            for i in range(locator.count()):
                candidate = locator.nth(i)

                if candidate.is_visible():
                    button = candidate
                    break

            if button:
                break

        except Exception:
            continue

    if button is None:
        try:
            locator = page.locator(
                'button[type="submit"], '
                'input[type="submit"], '
                "button"
            )

            for i in range(locator.count()):
                candidate = locator.nth(i)

                if candidate.is_visible():
                    button = candidate
                    break

        except Exception:
            pass

    if button is None:
        print("Botão de transcrição não encontrado.")
        return None

    print("Solicitando transcrição...")

    try:
        button.click(timeout=15000)
    except Exception:
        try:
            button.click(force=True)
        except Exception as exc:
            print(f"Falha ao clicar: {exc}")
            return None

    page.wait_for_timeout(12000)

    try:
        page.wait_for_load_state(
            "networkidle",
            timeout=30000
        )
    except Exception:
        pass

    print("Página de resultado carregada.")

    transcript = extract_transcript_from_page(page)

    if transcript:
        print(
            f"Transcrição encontrada no 2outube "
            f"({len(transcript)} caracteres)."
        )

    return transcript


def try_2outube_with_retries(page, video_id, youtube_url):
    for attempt in range(1, MAX_2OUTUBE_ATTEMPTS + 1):

        print("")
        print("=" * 60)
        print(
            f"TENTATIVA 2OUTUBE "
            f"{attempt}/{MAX_2OUTUBE_ATTEMPTS}"
        )
        print("=" * 60)

        transcript = try_2outube_direct(
            page,
            video_id
        )

        if transcript:
            return transcript

        transcript = try_2outube_form(
            page,
            youtube_url
        )

        if transcript:
            return transcript

        try:
            Path(
                f"debug_2outube_{attempt}.html"
            ).write_text(
                page.content(),
                encoding="utf-8"
            )
        except Exception:
            pass

        if attempt < MAX_2OUTUBE_ATTEMPTS:
            print(
                f"Transcrição ainda não disponível. "
                f"Aguardando {WAIT_BETWEEN_ATTEMPTS} segundos..."
            )

            time.sleep(
                WAIT_BETWEEN_ATTEMPTS
            )

    return None


def try_youtube_transcript_ai(video_id):
    print("")
    print("Tentando fallback youtube-transcript.ai...")

    url = (
        "https://youtube-transcript.ai/"
        f"transcript/{video_id}.txt"
    )

    request = Request(
        url,
        headers={
            "User-Agent": (
                "Mozilla/5.0 "
                "(Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 "
                "(KHTML, like Gecko) "
                "Chrome/140.0 Safari/537.36"
            ),
            "Accept": (
                "text/plain,text/html,"
                "application/xhtml+xml"
            ),
        },
    )

    try:
        with urlopen(
            request,
            timeout=60
        ) as response:

            raw = response.read()

        transcript = raw.decode(
            "utf-8",
            errors="replace"
        )

        transcript = clean_transcript(
            transcript
        )

        if transcript:
            print(
                "Fallback youtube-transcript.ai funcionou: "
                f"{len(transcript)} caracteres."
            )

            return transcript

    except HTTPError as exc:
        print(
            f"youtube-transcript.ai retornou HTTP "
            f"{exc.code}"
        )

    except URLError as exc:
        print(
            f"Erro de rede no youtube-transcript.ai: "
            f"{exc}"
        )

    except Exception as exc:
        print(
            f"Erro no youtube-transcript.ai: {exc}"
        )

    return None


def try_youtube_to_transcript(page, youtube_url):
    print("")
    print("Tentando fallback YouTubeToTranscript...")

    try:
        page.goto(
            "https://youtubetotranscript.com/",
            wait_until="domcontentloaded",
            timeout=90000
        )

        page.wait_for_timeout(5000)

        selectors = [
            'input[type="url"]',
            'input[name*="url"]',
            'input[id*="url"]',
            'input[placeholder*="YouTube"]',
            'input[placeholder*="youtube"]',
            'input[placeholder*="Paste"]',
            'input[placeholder*="paste"]',
            "input",
        ]

        input_box = None

        for selector in selectors:
            locator = page.locator(selector)

            for i in range(locator.count()):
                try:
                    candidate = locator.nth(i)

                    if candidate.is_visible():
                        input_box = candidate
                        break
                except Exception:
                    continue

            if input_box:
                break

        if input_box is None:
            print(
                "Campo de URL não encontrado "
                "no YouTubeToTranscript."
            )
            return None

        input_box.fill(
            youtube_url
        )

        page.wait_for_timeout(1000)

        possible_buttons = [
            "Get Transcript",
            "Generate Transcript",
            "Transcript",
            "Transcribe",
            "Generate",
            "Submit",
        ]

        clicked = False

        for text in possible_buttons:
            try:
                locator = page.get_by_text(
                    text,
                    exact=False
                )

                for i in range(locator.count()):
                    candidate = locator.nth(i)

                    if candidate.is_visible():
                        candidate.click()
                        clicked = True
                        break

                if clicked:
                    break

            except Exception:
                continue

        if not clicked:
            buttons = page.locator(
                'button[type="submit"], button'
            )

            for i in range(buttons.count()):
                try:
                    candidate = buttons.nth(i)

                    if candidate.is_visible():
                        candidate.click()
                        clicked = True
                        break

                except Exception:
                    continue

        if not clicked:
            print(
                "Botão não encontrado "
                "no YouTubeToTranscript."
            )
            return None

        page.wait_for_timeout(15000)

        try:
            page.wait_for_load_state(
                "networkidle",
                timeout=30000
            )
        except Exception:
            pass

        transcript = extract_transcript_from_page(
            page
        )

        if transcript:
            print(
                "YouTubeToTranscript funcionou: "
                f"{len(transcript)} caracteres."
            )

            return transcript

    except Exception as exc:
        print(
            f"Falha no YouTubeToTranscript: {exc}"
        )

    return None


def save_transcript(video_id, youtube_url, transcript):
    if not transcript:
        raise RuntimeError(
            "Transcrição vazia."
        )

    if len(transcript) < MIN_TRANSCRIPT_LENGTH:
        raise RuntimeError(
            "Transcrição curta demais para ser considerada válida."
        )

    output = (
        f"VIDEO_ID: {video_id}\n"
        f"URL: {youtube_url}\n\n"
        f"{transcript}\n"
    )

    temp_file = Path(
        "ultima_live_nova.txt"
    )

    temp_file.write_text(
        output,
        encoding="utf-8"
    )

    if temp_file.stat().st_size < MIN_TRANSCRIPT_LENGTH:
        temp_file.unlink(
            missing_ok=True
        )

        raise RuntimeError(
            "Arquivo temporário ficou pequeno demais."
        )

    temp_file.replace(
        OUTPUT_FILE
    )

    print("")
    print("=" * 60)
    print("SUCESSO")
    print("=" * 60)
    print(f"VIDEO_ID: {video_id}")
    print(f"URL: {youtube_url}")
    print(
        f"Tamanho da transcrição: "
        f"{len(transcript)} caracteres"
    )
    print(
        f"Arquivo salvo: {OUTPUT_FILE}"
    )


def main():
    print("Abrindo canal do Fabio Adriano...")

    with sync_playwright() as p:

        browser = p.chromium.launch(
            headless=True
        )

        context = browser.new_context(
            viewport={
                "width": 1365,
                "height": 900
            },
            user_agent=(
                "Mozilla/5.0 "
                "(Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 "
                "(KHTML, like Gecko) "
                "Chrome/140.0.0.0 Safari/537.36"
            ),
            locale="pt-BR",
        )

        page = context.new_page()

        try:
            video_id, youtube_url = find_latest_live(
                page
            )

            print("")
            print(f"VIDEO_ID encontrado: {video_id}")
            print(f"URL completa: {youtube_url}")

            transcript = try_2outube_with_retries(
                page,
                video_id,
                youtube_url
            )

            if not transcript:
                transcript = try_youtube_transcript_ai(
                    video_id
                )

            if not transcript:
                transcript = try_youtube_to_transcript(
                    page,
                    youtube_url
                )

            if not transcript:
                raise RuntimeError(
                    "Nenhuma das rotas conseguiu obter "
                    "a transcrição da live. "
                    "O ultima_live.txt anterior foi preservado."
                )

            save_transcript(
                video_id,
                youtube_url,
                transcript
            )

        finally:
            browser.close()


if __name__ == "__main__":
    main()
