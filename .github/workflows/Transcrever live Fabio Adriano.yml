name: Transcrever live Fabio Adriano

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install chromium

      - name: Rodar transcrição
        run: python transcrever_live_fabio.py

      - name: Commit da transcrição
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultima_live.txt
          git diff --cached --quiet || git commit -m "Atualiza transcrição da última live"
          git push
