name: Transcrever última live BTG Trader

on:
  workflow_dispatch:
    inputs:
      force_retranscribe:
        description: "Forçar nova transcrição mesmo se o vídeo já estiver salvo"
        required: false
        default: "1"
        type: choice
        options:
          - "0"
          - "1"

  schedule:
    # 08:00 em São Paulo = 11:00 UTC
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: transcrever-live-btg
  cancel-in-progress: true

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Executar transcrição BTG Trader
        env:
          CHANNEL_NAME: "BTG Trader"
          CHANNEL_URL: "https://www.youtube.com/@BTGTrader/streams"
          CONTENT_KIND: "live"
          OUTPUT_FILE: "ultima_live_btg.txt"
          DISCOVERY_MODE: "btg_recent_completed"
          BTG_MIN_AGE_DAYS: "1"
          BTG_MAX_AGE_DAYS: "2"
          FORCE_RETRANSCRIBE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_retranscribe || '0' }}
          TRANSCRIPT_WAIT_SECONDS: "150"
          POLL_INTERVAL_SECONDS: "5"
          MAX_PROVIDER_CYCLES: "2"
          WAIT_BETWEEN_CYCLES: "20"
        run: |
          python transcrever_live_fabio.py

      - name: Formatar transcrição
        if: always()
        run: |
          python formatar_transcricoes.py

      - name: Salvar transcrição no repositório
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f ultima_live_btg.txt ]; then
            git add ultima_live_btg.txt
          else
            echo "Arquivo ultima_live_btg.txt não foi gerado."
          fi

          if git diff --cached --quiet; then
            echo "Nenhuma transcrição nova para salvar."
          else
            git commit -m "Atualiza transcrição da última live BTG Trader"
            git push
          fi
