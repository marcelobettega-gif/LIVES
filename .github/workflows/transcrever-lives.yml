name: Transcrever playlist LIVES

on:
  workflow_dispatch:
    inputs:
      retry_errors:
        description: "Tentar novamente vídeos que possuem arquivo de erro"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: transcricoes-lives
  cancel-in-progress: false

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositório LIVES
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Transcrever os vídeos da playlist
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RETRY_ERRORS: ${{ inputs.retry_errors }}
        run: |
          test -n "$PLAYLIST_URL" || (echo "Defina PLAYLIST_URL em Settings > Secrets and variables > Actions > Variables." && exit 2)
          if [ "$RETRY_ERRORS" = "true" ]; then
            python transcrever_playlist_lives.py --playlist-url "$PLAYLIST_URL" --retry-errors
          else
            python transcrever_playlist_lives.py --playlist-url "$PLAYLIST_URL"
          fi

      - name: Salvar transcrições e erros no repositório LIVES
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcricoes erros
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo para salvar."
          else
            git commit -m "chore: adiciona transcrições da playlist"
            git push
          fi
