name: Transcrever live Fabio Adriano

on:
  workflow_dispatch:
  schedule:
    # 06:00 em São Paulo = 09:00 UTC
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Rodar transcrição
        run: python transcrever_live_fabio.py
      - name: Commit da transcrição
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultima_live.txt
          git diff --cached --quiet || git commit -m "Atualiza transcrição da última live Fabio Adriano"
          git push
