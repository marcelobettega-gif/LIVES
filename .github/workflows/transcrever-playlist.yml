name: Transcrever playlist do YouTube

on:
  workflow_dispatch:
  push:
    paths:
      - "transcrever_lives.py"
      - ".github/workflows/transcrever-playlist.yml"

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório LIVES
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Node.js para runtime JavaScript
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: Validar configurações
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
        run: |
          if [ -z "$PLAYLIST_URL" ]; then
            echo "Erro: crie a variável PLAYLIST_URL em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Transcrever os vídeos da playlist
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
          OUTPUT_DIR: transcricoes
          TRANSCRIPT_LANGUAGE: pt.*
        run: |
          python transcrever_lives.py

      - name: Salvar transcrições no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcricoes/
          if git diff --cached --quiet; then
            echo "Nenhuma transcrição nova para salvar."
          else
            git commit -m "Adicionar transcrições da playlist"
            git push
          fi

      - name: Disponibilizar transcrições para download
        uses: actions/upload-artifact@v4
        with:
          name: transcricoes-playlist
          path: transcricoes/
          if-no-files-found: warn
          retention-days: 30
