name: Transcrever playlist LIVES

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório LIVES
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validar configurações
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$PLAYLIST_URL" ]; then
            echo "Erro: crie a variável PLAYLIST_URL em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "Erro: crie o secret YOUTUBE_API_KEY em Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Transcrever os vídeos da playlist
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RETRY_ERRORS: "true"
        run: |
          if [ "$RETRY_ERRORS" = "true" ]; then
            python transcrever_playlist_lives.py --playlist-url "$PLAYLIST_URL" --retry-errors
          else
            python transcrever_playlist_lives.py --playlist-url "$PLAYLIST_URL"
          fi

      - name: Salvar transcrições e erros no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcricoes/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualiza transcrições da playlist"
            git push
          fi
