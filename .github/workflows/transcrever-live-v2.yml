# Novo workflow — transcrever-live-v2.yml

Crie o arquivo:

`.github/workflows/transcrever-live-v2.yml`

com este conteúdo:

```yaml
name: Transcrever live Fabio Adriano v2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # 09:00 em São Paulo enquanto UTC-3

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Conferir estrutura do repositório
        run: |
          pwd
          echo "Arquivos na raiz:"
          ls -la
          echo "Workflows:"
          find .github/workflows -maxdepth 1 -type f -print || true
          test -f ./transcrever.py || (echo "ERRO: transcrever.py não está na raiz do repositório" && exit 2)

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Rodar transcrição
        run: python ./transcrever.py

      - name: Conferir resultado
        run: |
          test -s ultima_live.txt || (echo "ERRO: ultima_live.txt não foi criado ou está vazio" && exit 3)
          echo "Transcrição gerada com sucesso."
          wc -c ultima_live.txt
          head -n 5 ultima_live.txt || true

      - name: Salvar resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultima_live.txt

          if git diff --cached --quiet; then
            echo "Nenhuma mudança em ultima_live.txt"
          else
            git commit -m "Atualiza transcrição da última live"
            git push
          fi
```
